project:
  type: website
  output-dir: docs
  post-render: _scripts/fix-404-paths.py
  resources:
    - CNAME
    - .nojekyll
    - assets/Logos/app-icon-180.png

execute:
  freeze: auto

website:
  title: "Nakai Zemer"
  site-url: https://kai.do
  description: "Math and data science for fire & EMS."
  favicon: assets/Logos/favicon.svg
  draft-mode: gone
  open-graph: true
  twitter-card: true
  # Site-wide default link-preview image (1200x630). Source: _design/share-card.html
  image: /assets/share-card.png
  image-alt: "Nakai Zemer: Math and Data Science for Fire & EMS. kai.do"
  navbar:
    logo: assets/Logos/kaido-mark-on-teal.svg
    logo-alt: "Kaido Analytics mark"
    title: '<span class="brand-domain">kai.do</span> Nakai Zemer'
    right:
      - href: posts.qmd
        text: Posts
      - href: projects.qmd
        text: Projects
      - href: resume.qmd
        text: Resume
      - href: about.qmd
        text: About
      - icon: github
        href: https://github.com/kai-do
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/nakai-zemer
        aria-label: LinkedIn
      - icon: rss
        href: posts.xml
        aria-label: RSS
  page-footer:
    left: "© {{< now year >}} Nakai Zemer · Kaido Analytics LLC"
    right:
      - text: RSS
        href: posts.xml

format:
  html:
    theme:
      light: [cosmo, assets/_light.scss, styles.scss]
      dark: [cosmo, assets/_dark.scss, styles.scss]
    highlight-style:
      light: github
      dark: nord
    html-math-method: katex
    date-format: iso
    toc: false
    include-in-header: [assets/goatcounter.html, assets/head-icons.html]
    include-after-body: assets/category-tags.html
