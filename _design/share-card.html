<!-- Source for assets/share-card.png (1200x630 link-preview image).
     Regenerate: headless Edge/Chrome --window-size=1200,630 --screenshot=assets/share-card.png file:///.../_design/share-card.html -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid;
    grid-template-columns: 1fr 420px;
    background: #f7faff;               /* surface (neutral-50) */
    color: #0c1b33;                    /* ink (prussian-blue) */
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .text {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 64px;                   /* space-16 */
    border-bottom: 12px solid #e09a3e; /* the one gold mark */
  }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-weight: 400; font-size: 96px; line-height: 1.02; margin: 0 0 24px;
  }
  .tagline { font-size: 36px; line-height: 1.3; color: #545b66; margin: 0 0 48px; }  /* ink-muted */
  .domain {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 30px; font-weight: 500; color: #0e6b6b;                               /* brand */
  }
  .mark {
    background: #0e6b6b;               /* header-bg: the ground kaido-mark-on-teal is drawn for */
    display: flex; align-items: center; justify-content: center;
  }
  .mark img { width: 340px; height: 340px; }
</style>
</head>
<body>
  <div class="text">
    <h1>Nakai Zemer</h1>
    <p class="tagline">Math and Data Science for Fire &amp; EMS</p>
    <div class="domain">kai.do</div>
  </div>
  <div class="mark"><img src="../assets/Logos/kaido-mark-on-teal.svg" alt=""></div>
</body>
</html>
